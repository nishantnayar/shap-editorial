# Pre-commit hooks. Install once with:  uv run pre-commit install
# Then Ruff lint + format run automatically on every `git commit`.
# Keep `rev` in sync with the `ruff` pin in pyproject.toml's [dev] extra.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
