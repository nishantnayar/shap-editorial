[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shap-editorial"
version = "0.1.2"
description = "Publication-ready charts for SHAP explanations: a styling/layout layer over shap.Explanation objects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Nayar", email = "nishant.nayar@yahoo.com" }]
keywords = ["shap", "explainability", "visualization", "matplotlib", "charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "pre-commit>=3", "pillow>=10"]
example = ["shap>=0.44", "scikit-learn>=1.2"]

[project.urls]
Homepage = "https://github.com/nishantnayar/shap-editorial"
Repository = "https://github.com/nishantnayar/shap-editorial"
Issues = "https://github.com/nishantnayar/shap-editorial/issues"

[tool.hatch.build]
exclude = [
    "examples/images/",
    "article/",
    "tools/",
    "_img_before/",
    ".claude/",
    ".github/",
    ".idea/",
    ".ruff_cache/",
    ".pytest_cache/",
    "uv.lock",
    "docs/TESTING.md",
    "REVIEW.md",
    "CLAUDE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shap_editorial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Examples insert `src` onto sys.path before importing the package, so imports
# intentionally don't all sit at the top of the file.
"examples/*.py" = ["E402"]
"tests/*.py" = ["E402"]
